# Works with Cloudflare deploy command: npx wrangler deploy
# (Workers + static assets + /api/contact)
name = "portfolio"
main = "./worker.js"
compatibility_date = "2025-08-09"

[assets]
directory = "./dist"
binding = "ASSETS"
# Match sitemap + canonicals (no trailing slash). Default auto-trailing-slash
# 307s /solutions/foo → /solutions/foo/, which GSC reports as redirects + duplicates.
html_handling = "drop-trailing-slash"
not_found_handling = "single-page-application"
# Run the Worker first for API; everything else is static SPA assets.
run_worker_first = ["/api/*"]
