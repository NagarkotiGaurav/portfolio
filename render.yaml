# Render Blueprint — Static Site
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: consultancy-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SITE_URL
        value: https://gauravnagarkoti.tech
    routes:
      # Existing files in dist/ (robots.txt, sitemap.xml, assets, images) are served as-is.
      # Unmatched paths fall through to the SPA shell for client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /
        name: X-Content-Type-Options
        value: nosniff
