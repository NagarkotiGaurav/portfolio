# Render Blueprint — Static Site + Contact API (Telegram)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: consultancy-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SITE_URL
        value: https://gauravnagarkoti.tech
      # After the contact-api service is live, set this to:
      # https://<contact-api-host>/api/contact
      # - key: VITE_CONTACT_ENDPOINT
      #   value: https://portfolio-contact-api.onrender.com/api/contact
    routes:
      # Existing files in dist/ (robots.txt, sitemap.xml, assets, images) are served as-is.
      # Unmatched paths fall through to the SPA shell for client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /
        name: X-Content-Type-Options
        value: nosniff

  # Leads → Telegram + Google Sheets (secrets stay server-side; never use VITE_)
  - type: web
    name: portfolio-contact-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GOOGLE_SHEETS_ENABLED
        value: "true"
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SHEETS_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://gauravnagarkoti.tech
